name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cachelab
          POSTGRES_PASSWORD: cachelab
          POSTGRES_DB: cachelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cachelab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          RUN_INTEGRATION: 'true'
          RUN_OUTBOX_INTEGRATION: 'true'
          TEST_REDIS_HOST: localhost
          TEST_REDIS_PORT: 6379
          TEST_REDIS_DB: 15
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5432
          TEST_DB_USER: cachelab
          TEST_DB_PASSWORD: cachelab
          TEST_DB_NAME: cachelab
      - run: npm run build

  compose-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: docker compose up --build --wait
      - run: npm run test:e2e
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
